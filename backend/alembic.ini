# Configuración de Alembic para FacturaLibre.
# La URL de la base NO se hardcodea aquí: env.py la toma de app.core.config.

[alembic]
script_location = %(here)s/app/infrastructure/migrations
prepend_sys_path = .
path_separator = os

# Dejar vacío. La conexión real se configura en migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
