[project]
name = "facturalibre-backend"
version = "0.1.0"
description = "Backend del MVP educativo de FacturaLibre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "lxml>=6.1.3",
    "qrcode[pil]>=8.2",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.13.0,<3.0.0",
    "pip-audit>=2.10.1",
    "pypdf>=6.21.2",
    "pytest>=9.0.3",
    "ruff>=0.8.0,<1.0.0",
]

[tool.uv]
# Proyecto de aplicación, no una librería instalable.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_configs = true
ignore_missing_imports = true
